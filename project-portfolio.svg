<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Academic planner interface mockup showing task list" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="560" height="360" fill="#131B2C"/>
  <rect x="0" y="0" width="560" height="44" fill="#0C1220"/>
  <text x="24" y="27" font-family="Work Sans" font-size="12" fill="#93A0B6">Academic Planner</text>

  <rect x="24" y="60" width="512" height="44" rx="3" fill="none" stroke="#263349"/>
  <text x="38" y="87" font-family="Work Sans" font-size="12" fill="#93A0B6">+ Add a new task…</text>

  <g font-family="Work Sans" font-size="13">
    <line x1="24" y1="120" x2="536" y2="120" stroke="#263349"/>
    <circle cx="40" cy="140" r="8" fill="#C6A15B"/>
    <text x="60" y="145" fill="#93A0B6" text-decoration="line-through">Submit COS 106 term project</text>

    <line x1="24" y1="160" x2="536" y2="160" stroke="#263349"/>
    <circle cx="40" cy="180" r="8" fill="none" stroke="#8E7644"/>
    <text x="60" y="185" fill="#ECEFF5">Revise ISC2 CC domain 3</text>

    <line x1="24" y1="200" x2="536" y2="200" stroke="#263349"/>
    <circle cx="40" cy="220" r="8" fill="none" stroke="#8E7644"/>
    <text x="60" y="225" fill="#ECEFF5">Prepare SwiftMarketplace launch checklist</text>
    <line x1="24" y1="240" x2="536" y2="240" stroke="#263349"/>
  </g>

  <text x="24" y="270" font-family="Work Sans" font-size="11" fill="#93A0B6">1 of 3 tasks complete</text>
  <rect x="24" y="280" width="512" height="4" rx="2" fill="#263349"/>
  <rect x="24" y="280" width="170" height="4" rx="2" fill="#3E8E82"/>
</svg>
